[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ogame_sim"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "torchrl",
    "gymnasium",
    "numpy",
    "tyro",
    "wandb",
    "tensorboard"
]

[project.optional-dependencies]
dev = [
    "pytest"
]
